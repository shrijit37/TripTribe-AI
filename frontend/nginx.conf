server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uniform fleet health contract (exact shape, no auth).
    # __APP_VERSION__ and __BACKEND_URL__ are baked at CI build time.
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"triptribe-web","version":"__APP_VERSION__","checks":{"assets":"up"}}';
    }

    # Proxy API calls to the backend. Same /api/* prefix as Express
    # mounts, so no rewrite (see vite.config.js dev proxy).
    location /api/ {
        proxy_pass __BACKEND_URL__;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
