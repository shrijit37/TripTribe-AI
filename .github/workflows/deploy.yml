name: CI + Deploy to Dokploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: triptribe-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: shrijit37

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend — install + syntax check + tests
        run: |
          npm ci --ignore-scripts
          # Parse every changed module, not just the entrypoint: a syntax
          # error in a file index.js never imports would otherwise ship.
          node --check index.js
          node --check routes/health.js
          node --check routes/itenaryRoute.js
          node --check controllers/gptResponse.js
          node --check config/schema.js
          node --check services/narrate.js
          node --check services/compose.js
          node --check solver/pipeline.js
          node --check routes/seoRoute.js
          node --check services/catalogue.js
          node --check models/placeCacheModel.js
          # Full deterministic suite — request contract, services and solver.
          # No API keys required, so it runs on every PR.
          node --test tests/schema.test.js tests/services.test.js tests/solver.test.js
        working-directory: backend
      - name: Frontend — typecheck + lint + build
        run: |
          npm ci --ignore-scripts
          # `strict` plus `noUncheckedIndexedAccess`: the type errors the build
          # would catch anyway, reported before it costs a full compile.
          npm run typecheck
          npm run lint
          npm run build
        working-directory: frontend

  build:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Infisical is the single source of truth for every key. The frontend
      # key lives in the frontend project (pinned by .infisical.json);
      # GH secrets must not duplicate it, or the two silently drift.
      - name: Fetch frontend keys from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: 9541bd35-aa6f-4719-b663-ec7ec99b8073
          env-slug: prod
          domain: https://secrets.shrijit.tech
          export-type: env
      - name: Build+push triptribe-api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=triptribe-api
          cache-to: type=gha,mode=max,scope=triptribe-api
          build-args: APP_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ env.OWNER }}/triptribe-ai-api:${{ github.sha }}
      - name: Build+push triptribe-web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=triptribe-web
          cache-to: type=gha,mode=max,scope=triptribe-web
          # The catalogue URL and proxy target are read at request time on the
          # server, so they stay out of the client bundle. Internal swarm DNS
          # (no public hairpin: container egress to the public IP is
          # unreliable). App names are stable; if the api app is recreated,
          # update this + STATE.md.
          build-args: |
            APP_VERSION=${{ github.sha }}
            BACKEND_URL=http://triptribe-api-y59lny:8080
            CATALOGUE_API_URL=http://triptribe-api-y59lny:8080/api/seo/city-catalogue
            NEXT_PUBLIC_ITENARY_API_URL=/api/itenary
            NEXT_PUBLIC_GOOGLE_PLACES_API_KEY=${{ env.VITE_GOOGLE_PLACES_API_KEY }}
            NEXT_PUBLIC_AUTH_URL=https://auth.shrijit.tech
            NEXT_PUBLIC_SITE_URL=https://triptribe.shrijit.tech
          tags: ghcr.io/${{ env.OWNER }}/triptribe-ai-web:${{ github.sha }}

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    env:
      DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      # Dokploy authenticates GHCR pulls with a long-lived pull token kept
      # in the GHCR_PULL_TOKEN repo secret. Never send GITHUB_TOKEN here:
      # it expires after the job and silently breaks every later pull.
      - name: Re-assert Dokploy env (Infisical sync wipes app env)
        run: |
          DOL='$'
          REF="${DOL}{{vault.infisical-prod."
          post_env() {
            curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" \
              -H 'Content-Type: application/json' -d @- \
              "$DOKPLOY_URL/api/application.saveEnvironment" >/dev/null
          }
          jq -n --arg ref "$REF" \
            --arg id "${{ vars.DOKPLOY_API_APP_ID }}" \
            '{applicationId: $id,
              env: ("PORT=8080\nAUTH_URL=http://app-copy-mobile-transmitter-zblo2d:8080\nMONGO_URI=" + $ref + "TRIPTRIBE_MONGO_URI}}\nOPENAI_KEY=" + $ref + "TRIPTRIBE_OPENAI_KEY}}\nGOOGLE_CUSTOM_SEARCH_API_KEY=" + $ref + "TRIPTRIBE_GOOGLE_SEARCH_KEY}}\nOPENAI_BASE_URL=" + $ref + "TRIPTRIBE_OPENAI_BASE_URL}}\nOPENAI_MODEL=" + $ref + "TRIPTRIBE_OPENAI_MODEL}}\nGOOGLE_PLACES_API_KEY=" + $ref + "TRIPTRIBE_GOOGLE_PLACES_API_KEY}}\nGOOGLE_ROUTES_API_KEY=" + $ref + "TRIPTRIBE_GOOGLE_PLACES_API_KEY}}"),
              buildArgs: "", buildSecrets: "", createEnvFile: true}' | post_env
          echo "dokploy env re-asserted"
      - name: Point Dokploy at SHA images and redeploy
        run: |
          point() {
            curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"applicationId\":\"$1\",\"dockerImage\":\"$2\",\"username\":\"${{ github.actor }}\",\"password\":\"$GHCR_TOKEN\",\"registryUrl\":\"ghcr.io\"}" \
              "$DOKPLOY_URL/api/application.saveDockerProvider" &&
            curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"applicationId\":\"$1\"}" \
              "$DOKPLOY_URL/api/application.redeploy" >/dev/null
          }
          point "${{ vars.DOKPLOY_API_APP_ID }}" "ghcr.io/$OWNER/triptribe-ai-api:$SHA"
          point "${{ vars.DOKPLOY_WEB_APP_ID }}" "ghcr.io/$OWNER/triptribe-ai-web:$SHA"
          echo "redeploy triggered for $SHA"
      # Wait on /health, and require the deployed build to BE this SHA.
      #
      # Checking health alone is not enough: the previous container is still
      # serving while the new one starts, so the first poll succeeds against
      # the old build and the gate reports success. That is how the frontend
      # migration shipped a green run while the web app 502'd — the old nginx
      # container answered /health, then died, and nothing noticed.
      #
      # `/health` carries `version`, so requiring it to equal the SHA proves we
      # are talking to the build we just pushed rather than the one we replaced.
      - name: Wait for the new containers to converge
        run: |
          for i in $(seq 1 30); do
            ok=0
            for base in "${{ vars.API_URL }}" "${{ vars.WEB_URL }}"; do
              body=$(curl -s --max-time 10 "$base/health" || echo '')
              if echo "$body" | grep -q '"status":"ok"\|"status":"degraded"'; then
                if echo "$body" | grep -q "\"version\":\"$SHA"; then
                  ok=$((ok+1))
                else
                  echo "$base healthy but still serving $(echo "$body" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
                fi
              fi
            done
            if [ "$ok" = "2" ]; then
              echo "both services healthy on $SHA after $i attempt(s)"
              exit 0
            fi
            echo "attempt $i/30: $ok/2 on $SHA"
            sleep 10
          done
          echo "services did not converge on $SHA" >&2
          exit 1
