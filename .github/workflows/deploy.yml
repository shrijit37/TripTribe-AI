name: CI + Deploy to Dokploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: triptribe-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: shrijit37

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install + typecheck + lint + test + build
        run: |
          npm ci --ignore-scripts
          # `strict` plus `noUncheckedIndexedAccess`: the type errors the build
          # would catch anyway, reported before it costs a full compile.
          npm run typecheck
          npm run lint
          # The deterministic suite — request contract, solver, services. No API
          # keys required, so it runs on every PR.
          npm test
          npm run build
        working-directory: frontend

  build:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Infisical is the single source of truth for every key. The frontend
      # key lives in the frontend project (pinned by .infisical.json);
      # GH secrets must not duplicate it, or the two silently drift.
      - name: Fetch frontend keys from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: 9541bd35-aa6f-4719-b663-ec7ec99b8073
          env-slug: prod
          domain: https://secrets.shrijit.tech
          export-type: env
      # One image. The API is a route handler in this app, so there is no
      # second image to build, pull, configure or point Dokploy at — and no way
      # for the two to disagree about a URL again. The previous build baked
      # BACKEND_URL=http://triptribe-api-y59lny:8080 into the image while the
      # deploy step set AUTH_URL=http://app-copy-mobile-transmitter-zblo2d:8080,
      # so the session lookup resolved to a service that did not exist.
      - name: Build+push triptribe-web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=triptribe-web
          cache-to: type=gha,mode=max,scope=triptribe-web
          build-args: |
            APP_VERSION=${{ github.sha }}
            NEXT_PUBLIC_GOOGLE_PLACES_API_KEY=${{ env.VITE_GOOGLE_PLACES_API_KEY }}
            NEXT_PUBLIC_AUTH_URL=https://auth.shrijit.tech
            NEXT_PUBLIC_SITE_URL=https://triptribe.shrijit.tech
          tags: ghcr.io/${{ env.OWNER }}/triptribe-ai-web:${{ github.sha }}

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    env:
      DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      SHA: ${{ needs.build.outputs.sha }}
      APP_ID: ${{ vars.DOKPLOY_WEB_APP_ID }}
    steps:
      # `shrijit-esdk`, not the frontend project the build job reads: the
      # app's own keys live here (README, `scripts/infisical-env.sh`). Reading
      # the frontend project instead would silently point the server at the
      # autocomplete key instead of the Places key.
      #
      # A read-only service token, not the machine identity the build job uses:
      # that identity is not a member of esdk, and adding it would hand the
      # build read access to every other product in the vault. The build job's
      # frontend fetch is unaffected — that identity still only sees the
      # frontend project.
      #
      # The token is what scopes this fetch, not the URL: this Infisical
      # version resolves the project from the bearer token, and a service
      # token is already bound to one project and one environment.
      # `workspaceId` is here to say which project is meant — read it as a
      # comment, not as a check. The `TRIPTRIBE_` filter is the check that
      # matters: the vault holds 53 keys across eight other products, and none
      # of those values should be in this job's environment even briefly.
      # (`DOKPLOY_API_KEY` lives in that same vault and is already a repo
      # secret here, so the token widens nothing this job could not read.)
      - name: Fetch app keys from Infisical (shrijit-esdk, prod)
        env:
          INFISICAL_ESDK_TOKEN: ${{ secrets.INFISICAL_ESDK_TOKEN }}
          WORKSPACE: 1a39a192-cf29-4ec9-812f-94c35cce34f2
        run: |
          set -euo pipefail
          payload=$(curl -fsS -H "Authorization: Bearer $INFISICAL_ESDK_TOKEN" \
            "https://secrets.shrijit.tech/api/v3/secrets/raw?workspaceId=$WORKSPACE&envSlug=prod&secretPath=/&recursive=false")
          count=$(printf '%s' "$payload" | jq -r '[.secrets[] | select(.secretKey | startswith("TRIPTRIBE_"))] | length')
          [ "$count" -gt 0 ] || { echo "esdk prod returned no TRIPTRIBE_* keys" >&2; exit 1; }
          printf '%s' "$payload" | jq -r '.secrets[] | select(.secretKey | startswith("TRIPTRIBE_")) | "::add-mask::\(.secretValue)", "\(.secretKey)=\(.secretValue)"' >> "$GITHUB_ENV"
          echo "fetched $count TRIPTRIBE_* keys from esdk prod"
      # Dokploy authenticates GHCR pulls with a long-lived pull token kept
      # in the GHCR_PULL_TOKEN repo secret. Never send GITHUB_TOKEN here:
      # it expires after the job and silently breaks every later pull.
      #
      # One application, one environment block.
      #
      # `AUTH_URL` used to point at `http://app-copy-mobile-transmitter-zblo2d:8080`
      # — the name of a scratch application, not the auth service — so every
      # authenticated request looked for a session at an address that was not
      # there. The public session endpoint is the only correct value now that
      # the backend and the web app are one process.
      #
      # `RESEND_*` are deliberately absent: they do not exist in Infisical prod,
      # and a reference Dokploy cannot resolve aborts the deployment. The email
      # hand-off is documented as degrading without them, so the app degrades
      # instead of the deploy.
      # One application, one environment block.
      #
      # `AUTH_URL` used to point at `http://app-copy-mobile-transmitter-zblo2d:8080`
      # — the name of a scratch application, not the auth service — so every
      # authenticated request looked for a session at an address that was not
      # there. The public session endpoint is the only correct value now that
      # the backend and the web app are one process.
      #
      # Values are resolved here rather than left as `${vault.infisical-prod.X}}`
      # references. Two separate faults came out of those references: Dokploy
      # aborts at `Initializing deployment` on a key missing from prod (three
      # deploys in a row — 395b1df, 522c265, 7a4de4c — returned success here and
      # then left the old container serving), and when they *do* resolve the
      # reference reached the container verbatim, so MONGO_URI arrived as a URI
      # nobody can dial.
      #
      # `RESEND_*` are deliberately absent: those keys do not exist in any
      # environment, and the email hand-off is documented as degrading without
      # them, so the app degrades instead of the deploy.
      - name: Re-assert Dokploy env (Infisical sync wipes app env)
        run: |
          post_env() {
            curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" \
              -H 'Content-Type: application/json' -d @- \
              "$DOKPLOY_URL/api/application.saveEnvironment" >/dev/null
          }
          # printf, not jq: jq -n on a string prints a JSON-quoted string, so
          # the guard below would be reading escaped `\n` and a leading quote
          # instead of the env text that gets POSTed.
          ENV=$(printf 'PORT=80\nAUTH_URL=https://auth.shrijit.tech\nMONGO_URI=%s\nOPENAI_KEY=%s\nOPENAI_BASE_URL=%s\nOPENAI_MODEL=%s\nGOOGLE_PLACES_API_KEY=%s\nGOOGLE_ROUTES_API_KEY=%s\nGOOGLE_CUSTOM_SEARCH_API_KEY=%s\nAPP_VERSION=%s' \
            "${TRIPTRIBE_MONGO_URI:-}" "${TRIPTRIBE_OPENAI_KEY:-}" \
            "${TRIPTRIBE_OPENAI_BASE_URL:-}" "${TRIPTRIBE_OPENAI_MODEL:-}" \
            "${TRIPTRIBE_GOOGLE_PLACES_API_KEY:-}" "${TRIPTRIBE_GOOGLE_PLACES_API_KEY:-}" \
            "${TRIPTRIBE_GOOGLE_SEARCH_KEY:-}" "$SHA")
          # Guarded before the write, and against the string about to be POSTed:
          # an empty value means Infisical prod does not have the key, an
          # unresolved reference means this step regressed to the form that
          # shipped a container which could not reach its database. Either one
          # wipes the app env on a *successful* deploy, so refuse instead.
          printf '%s\n' "$ENV" | grep -qE '^[A-Z_0-9]+=' \
            || { echo "env template is empty or malformed" >&2; exit 1; }
          if printf '%s\n' "$ENV" | grep -qE '^[A-Z_0-9]+=$|\$\{'; then
            echo "Infisical prod has no value for a key the template needs — refusing to overwrite the app env" >&2
            exit 1
          fi
          jq -n --arg id "$APP_ID" --arg env "$ENV" \
            '{applicationId: $id, env: $env,
              buildArgs: "", buildSecrets: "", createEnvFile: true}' | post_env || exit 1

      - name: Point Dokploy at the SHA image and redeploy
        run: |
          curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"applicationId\":\"${{ vars.DOKPLOY_WEB_APP_ID }}\",\"dockerImage\":\"ghcr.io/$OWNER/triptribe-ai-web:$SHA\",\"username\":\"${{ github.actor }}\",\"password\":\"$GHCR_TOKEN\",\"registryUrl\":\"ghcr.io\"}" \
            "$DOKPLOY_URL/api/application.saveDockerProvider" &&
          curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"applicationId\":\"${{ vars.DOKPLOY_WEB_APP_ID }}\"}" \
            "$DOKPLOY_URL/api/application.redeploy" >/dev/null
          echo "redeploy triggered for $SHA"
      # Wait on /api/health, and require the deployed build to BE this SHA.
      #
      # Checking health alone is not enough: the previous container is still
      # serving while the new one starts, so the first poll succeeds against
      # the old build and the gate reports success. That is how the frontend
      # migration shipped a green run while the web app 502'd — the old nginx
      # container answered /health, then died, and nothing noticed.
      #
      # `/api/health` carries `version`, so requiring it to equal the SHA proves
      # we are talking to the build we just pushed rather than the one we
      # replaced. One service to wait on now, not two.
      - name: Wait for the new containers to converge
        run: |
          for i in $(seq 1 30); do
            body=$(curl -s --max-time 10 "${{ vars.WEB_URL }}/api/health" || echo '')
            if echo "$body" | grep -q "\"version\":\"$SHA"; then
              # `version` matching means this is the build we just pushed. The
              # status field is then informational: "degraded" is a legitimate
              # pass for an app that is deliberately honest about missing keys,
              # whereas 503 means Mongo is down and the gate must fail.
              echo "web healthy on $SHA after $i attempt(s)"
              echo "$body"
              exit 0
            fi
            echo "attempt $i/30: not yet serving $SHA — $(echo "$body" | head -c 200)"
            sleep 10
          done
          echo "services did not converge on $SHA" >&2
          exit 1
