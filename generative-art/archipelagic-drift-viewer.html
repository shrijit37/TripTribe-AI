<!DOCTYPE html>
<!--
    ARCHIPELAGIC DRIFT — interactive generative art viewer.
    Structure + Anthropic branding kept from templates/viewer.html.
    VARIABLE sections (title, parameters, colors, algorithm) customized
    per the algorithmic philosophy in archipelagic-drift-philosophy.md.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archipelagic Drift — Generative Art Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        .stack-gap {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        .progress {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            text-align: center;
            margin-top: 8px;
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <h1>Archipelagic Drift</h1>
            <div class="subtitle">Travelers sediment into islands. Every seed charts a new archipelago.</div>

            <!-- Seed Section (FIXED) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section (VARIABLE — matches this artwork) -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Travelers</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="1500" max="8000" step="100" value="4200" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">4200</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Islands</label>
                    <div class="slider-container">
                        <input type="range" id="islandCount" min="2" max="9" step="1" value="5" oninput="updateParam('islandCount', this.value)">
                        <span class="value-display" id="islandCount-value">5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Turbulence</label>
                    <div class="slider-container">
                        <input type="range" id="turbulence" min="1" max="4" step="0.1" value="2.2" oninput="updateParam('turbulence', this.value)">
                        <span class="value-display" id="turbulence-value">2.2</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Current Speed</label>
                    <div class="slider-container">
                        <input type="range" id="flowSpeed" min="0.5" max="3" step="0.1" value="1.4" oninput="updateParam('flowSpeed', this.value)">
                        <span class="value-display" id="flowSpeed-value">1.4</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Swell Scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.0015" max="0.008" step="0.0005" value="0.0035" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.0035</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Weight</label>
                    <div class="slider-container">
                        <input type="range" id="trailWeight" min="0.4" max="2" step="0.1" value="1" oninput="updateParam('trailWeight', this.value)">
                        <span class="value-display" id="trailWeight-value">1.0</span>
                    </div>
                </div>
                <div class="progress" id="progress"></div>
            </div>

            <!-- Colors Section (VARIABLE — deep / shallow / drift inks) -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Deep Water</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#1e3a5f" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#1e3a5f</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Shallows</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#3e8e8c" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#3e8e8c</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Sunlit Drift</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#d97757" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#d97757</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="stack-gap">
                    <button class="button tertiary" onclick="regenerate()">↻ Regenerate</button>
                    <div class="button-row">
                        <button class="button" onclick="resetParameters()">Reset</button>
                        <button class="button secondary" onclick="downloadArt()">↓ PNG</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Charting the archipelago...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // ARCHIPELAGIC DRIFT — parameters (philosophy §5: a small helm, deep ocean)
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            particleCount: 4200,
            islandCount: 5,
            turbulence: 2.2,
            flowSpeed: 1.4,
            noiseScale: 0.0035,
            trailWeight: 1.0,
            colorPalette: ['#1e3a5f', '#3e8e8c', '#d97757'],
            paper: '#f4f1e8'
        };

        let defaultParams = JSON.parse(JSON.stringify(params)); // defaults for reset

        // ═══════════════════════════════════════════════════════════════════════
        // P5.JS ALGORITHM — sedimentation map-making (philosophy §§1–4)
        // ═══════════════════════════════════════════════════════════════════════

        const WORLD = 1000;
        const FIELD_CELL = 10;
        const MAX_STEPS = 320;
        const STEPS_PER_FRAME = 5;
        const TRAVELER_LIFE = 220;

        let field;
        let fCols, fRows;
        let islands = [];
        let travelers = [];
        let stepCount = 0;
        let inkDeep, inkShallow, inkDrift;

        function setup() {
            let canvas = createCanvas(WORLD, WORLD);
            canvas.parent('canvas-container');
            initializeSystem();
            let loader = document.querySelector('.loading');
            if (loader) loader.style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            noiseDetail(2, 0.55);

            stepCount = 0;
            inkDeep = color(params.colorPalette[0]);
            inkShallow = color(params.colorPalette[1]);
            inkDrift = color(params.colorPalette[2]);

            seedIslands();
            buildFlowField();
            seedTravelers();

            background(params.paper);
            loop();
            updateProgress();
        }

        function seedIslands() {
            islands = [];
            let guard = 0;
            while (islands.length < params.islandCount && guard++ < 400) {
                const m = WORLD * 0.14;
                const candidate = {
                    x: random(m, WORLD - m),
                    y: random(m, WORLD - m),
                    radius: random(60, 150),
                    strength: random(0.7, 1.4)
                };
                const ok = islands.every(
                    (o) => dist(candidate.x, candidate.y, o.x, o.y) > (candidate.radius + o.radius) * 1.15
                );
                if (ok) islands.push(candidate);
            }
        }

        function buildFlowField() {
            fCols = Math.floor(WORLD / FIELD_CELL);
            fRows = Math.floor(WORLD / FIELD_CELL);
            field = new Float32Array(fCols * fRows);
            const z = (params.seed % 1000) * 0.013;
            for (let gy = 0; gy < fRows; gy++) {
                for (let gx = 0; gx < fCols; gx++) {
                    const x = gx * FIELD_CELL;
                    const y = gy * FIELD_CELL;
                    let angle = noise(x * params.noiseScale, y * params.noiseScale, z) * TWO_PI * params.turbulence;
                    for (const isl of islands) {
                        const dx = x - isl.x;
                        const dy = y - isl.y;
                        const d = Math.sqrt(dx * dx + dy * dy) + 1e-4;
                        const influence = Math.exp(-(d * d) / (2 * isl.radius * isl.radius)) * isl.strength;
                        const tangent = Math.atan2(dy, dx) + HALF_PI;
                        angle = lerpAngle(angle, tangent, Math.min(0.85, influence));
                    }
                    field[gy * fCols + gx] = angle;
                }
            }
        }

        function lerpAngle(a, b, t) {
            let d = (b - a) % TWO_PI;
            if (d > PI) d -= TWO_PI;
            if (d < -PI) d += TWO_PI;
            return a + d * t;
        }

        function fieldAngle(x, y) {
            const gx = constrain(Math.floor(x / FIELD_CELL), 0, fCols - 1);
            const gy = constrain(Math.floor(y / FIELD_CELL), 0, fRows - 1);
            return field[gy * fCols + gx];
        }

        function seedTravelers() {
            travelers = [];
            for (let i = 0; i < params.particleCount; i++) travelers.push(spawnTraveler());
        }

        function spawnTraveler() {
            const edge = Math.floor(random(4));
            const t = random(WORLD);
            const m = 4;
            let x, y;
            if (edge === 0) { x = t; y = m; }
            else if (edge === 1) { x = t; y = WORLD - m; }
            else if (edge === 2) { x = m; y = t; }
            else { x = WORLD - m; y = t; }
            return { x, y, px: x, py: y, life: Math.floor(random(TRAVELER_LIFE * 0.4, TRAVELER_LIFE)) };
        }

        function draw() {
            for (let s = 0; s < STEPS_PER_FRAME && stepCount < MAX_STEPS; s++) {
                advectTravelers();
                stepCount++;
            }
            updateProgress();
            if (stepCount >= MAX_STEPS) {
                washBathymetry();
                noLoop();
                updateProgress();
            }
        }

        function advectTravelers() {
            for (let i = 0; i < travelers.length; i++) {
                const t = travelers[i];
                t.px = t.x;
                t.py = t.y;
                const a = fieldAngle(t.x, t.y);
                t.x += Math.cos(a) * params.flowSpeed;
                t.y += Math.sin(a) * params.flowSpeed;
                t.life--;

                const speedN = constrain(params.flowSpeed / 3, 0, 1);
                let ink;
                if (speedN < 0.5) ink = lerpColor(inkDeep, inkShallow, speedN * 2);
                else ink = lerpColor(inkShallow, inkDrift, (speedN - 0.5) * 2);

                let grounding = 0;
                for (const isl of islands) {
                    const d = dist(t.x, t.y, isl.x, isl.y);
                    if (d < isl.radius) { grounding = 1 - d / isl.radius; break; }
                }
                const alpha = 10 + speedN * 10 + grounding * 22;
                stroke(red(ink), green(ink), blue(ink), alpha);
                strokeWeight(params.trailWeight * (0.6 + grounding * 0.8));
                line(t.px, t.py, t.x, t.y);

                const beached = t.x < 0 || t.x > WORLD || t.y < 0 || t.y > WORLD || t.life <= 0;
                if (beached) travelers[i] = spawnTraveler();
            }
        }

        function washBathymetry() {
            noFill();
            for (const isl of islands) {
                for (let r = isl.radius * 0.45; r < isl.radius * 1.9; r += 13) {
                    stroke(red(inkShallow), green(inkShallow), blue(inkShallow), 16);
                    strokeWeight(1);
                    circle(isl.x, isl.y, r * 2);
                }
                noStroke();
                fill(red(inkDeep), green(inkDeep), blue(inkDeep), 26);
                circle(isl.x, isl.y, isl.radius * 0.55);
            }
        }

        function updateProgress() {
            const el = document.getElementById('progress');
            if (!el) return;
            if (stepCount >= MAX_STEPS) el.textContent = 'chart complete — ' + params.particleCount + ' voyages';
            else el.textContent = 'charting… ' + Math.round(stepCount / MAX_STEPS * 100) + '%';
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        const NUMERIC_PARAMS = ['particleCount', 'islandCount', 'turbulence', 'flowSpeed', 'noiseScale', 'trailWeight'];

        function updateParam(paramName, value) {
            const parsed = paramName === 'particleCount' || paramName === 'islandCount'
                ? parseInt(value, 10)
                : parseFloat(value);
            params[paramName] = parsed;
            document.getElementById(paramName + '-value').textContent = value;
            initializeSystem();
        }

        function updateColor(colorId, value) {
            const idx = { color1: 0, color2: 1, color3: 2 }[colorId];
            if (idx === undefined) return;
            params.colorPalette[idx] = value;
            document.getElementById(colorId + '-value').textContent = value;
            initializeSystem();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROLS (FIXED)
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function regenerate() {
            initializeSystem();
        }

        function downloadArt() {
            saveCanvas('archipelagic-drift-' + params.seed, 'png');
        }

        function resetParameters() {
            const seed = params.seed;
            params = JSON.parse(JSON.stringify(defaultParams));
            params.seed = seed; // keep current chart; reset the helm

            for (const key of NUMERIC_PARAMS) {
                document.getElementById(key).value = params[key];
                document.getElementById(key + '-value').textContent = params[key];
            }

            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];

            updateSeedDisplay();
            initializeSystem();
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
